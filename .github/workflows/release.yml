name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the build version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(./gradlew -q properties | sed -n 's/^version: //p')"
          [ "$want" = "$have" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $have in build.gradle.kts"; exit 1; }
          head -1 RELEASE_NOTES.md | grep -qx "# Usher $want" || { echo "RELEASE_NOTES.md is for another version. Its first line must be: # Usher $want"; exit 1; }
      - run: ./gradlew build
      - name: Attach the jar to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/Usher-*.jar --title "Usher $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag

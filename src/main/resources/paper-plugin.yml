name: Usher
version: '${version}'
main: com.extantape.usher.UsherPlugin
api-version: '26.1'
description: Approve new players and choose their profiles, without typing LuckPerms commands.
website: https://github.com/ExtantApe/Usher
dependencies:
  server:
    # Optional on purpose: without LuckPerms, Usher still loads and refuses every change, saying why.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    # Optional: with Latchkey, Usher checks an invite's profiles when it's made and applies them when it's used.
    # Usher reads Latchkey's events by name, so it builds and runs without it.
    Latchkey:
      load: BEFORE
      required: false
permissions:
  usher.approve:
    description: Approve people and change their profiles, by command or menu. Nobody can use it on themselves.
    default: false
  stationmaster.approve:
    description: The old name for usher.approve, from before the rename. Still works in 0.3.x and is removed in the next release; grant usher.approve instead.
    default: false

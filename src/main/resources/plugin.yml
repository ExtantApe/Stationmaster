name: Stationmaster
version: '${version}'
main: com.extantape.stationmaster.StationmasterPlugin
api-version: '1.21.11'
description: Approve new players and choose their profiles, without typing LuckPerms commands.
website: https://github.com/ExtantApe/Stationmaster
softdepend: [LuckPerms]
commands:
  approve:
    description: Let someone in and choose their profiles.
    usage: /approve <name>
  profile:
    description: See or change someone's profiles.
    usage: /profile <name> [edit]
  stationmaster:
    description: Console commands for Leaf Juice and scripts, and reload.
    usage: /stationmaster <profiles|resolve|show|apply|attempts|log|reload> <request-id> ...
    aliases: [smaster]
permissions:
  stationmaster.approve:
    description: Approve people and change their profiles, by command or menu. Nobody can use it on themselves.
    default: false
